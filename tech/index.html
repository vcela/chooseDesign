<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Stručný přehled technologií použitých v projektu ChooseDesign."
    />
    <title>ChooseDesign Tech Stack</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5efe6;
        --panel: rgba(255, 252, 247, 0.82);
        --text: #201915;
        --muted: #6c5850;
        --line: rgba(32, 25, 21, 0.12);
        --accent: #d26d46;
        --accent-soft: rgba(210, 109, 70, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        font-family: "Manrope", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(210, 109, 70, 0.16), transparent 28%),
          radial-gradient(circle at 85% 10%, rgba(57, 116, 166, 0.14), transparent 24%),
          linear-gradient(180deg, #f8f2ea 0%, var(--bg) 100%);
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0 72px;
      }

      .panel {
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--panel);
        backdrop-filter: blur(14px);
        box-shadow: 0 28px 80px rgba(25, 17, 11, 0.08);
      }

      .hero {
        margin-bottom: 18px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 0;
        font-family: "Fraunces", serif;
        font-size: clamp(2.3rem, 6vw, 4.5rem);
        line-height: 0.96;
        letter-spacing: -0.04em;
        max-width: 10ch;
      }

      .stack-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .stack-list li {
        display: grid;
        grid-template-columns: minmax(140px, 180px) 1fr;
        gap: 18px;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }

      .stack-list li:first-child {
        border-top: 1px solid var(--line);
      }

      .stack-list strong {
        font-size: 0.96rem;
        letter-spacing: 0.01em;
      }

      .stack-list span {
        color: var(--muted);
        line-height: 1.55;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 20px, 100%);
          padding: 20px 0 40px;
        }

        .panel {
          padding: 22px;
          border-radius: 22px;
        }

        .stack-list li {
          grid-template-columns: 1fr;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel hero">
        <span class="eyebrow">ChooseDesign</span>
        <h1>Tech stack tohoto projektu</h1>
      </section>

      <section class="panel">
        <ul class="stack-list">
          <li>
            <strong>Frontend</strong>
            <span>HTML, CSS, Vanilla JavaScript</span>
          </li>
          <li>
            <strong>Build</strong>
            <span>Vite</span>
          </li>
          <li>
            <strong>Routing</strong>
            <span>Multi-page entry + /tech rewrite</span>
          </li>
          <li>
            <strong>State</strong>
            <span>URL parametry</span>
          </li>
          <li>
            <strong>Hosting</strong>
            <span>Netlify</span>
          </li>
          <li>
            <strong>Serverless</strong>
            <span>Netlify Functions</span>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
